name: ORVEXA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  science-engine:
    name: Science & OR Engine (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        working-directory: services/science-engine
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Run OR & AI pytest suite
        working-directory: services/science-engine
        run: pytest -v

  api-and-web:
    name: Core API & Next.js Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install workspace dependencies
        run: npm ci
      - name: Run API domain tests
        run: npm run test:api
      - name: Type-check Core API
        run: ./node_modules/.bin/tsc -p apps/api/tsconfig.json --noEmit
      - name: Build Next.js Web Workbench
        run: npm run build:web
