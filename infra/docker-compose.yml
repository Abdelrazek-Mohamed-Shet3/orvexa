services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: orvexa-postgres
    environment:
      POSTGRES_USER: orvexa
      POSTGRES_PASSWORD: orvexa_dev_password
      POSTGRES_DB: orvexa
    ports:
      - "5432:5432"
    volumes:
      - orvexa_pgdata:/var/lib/postgresql/data
      - ../packages/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../packages/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orvexa -d orvexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8-alpine
    container_name: orvexa-valkey
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orvexa_pgdata:
